<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff3f6c">
<title>Anupriya Boutique | Pure Handwoven Mekhela Sador, Doom-Dooma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
:root{--p:#ff3f6c;--pd:#e0284f;--i:#282c3f;--m:#696e79;--g:#94969f;--l:#eaeaec;--bg:#f5f5f6;--o:#ff905a;--gr:#03a685;--r:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:520px;min-height:100vh;background:var(--bg);color:var(--i);font:400 14px/1.4 Roboto,system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.top{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 0 var(--l);padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px}
.logo{font:900 22px/1 Roboto,sans-serif;color:var(--p);text-transform:lowercase;letter-spacing:-.3px}
.ib{position:relative;width:36px;height:36px;border:0;border-radius:50%;background:none;font-size:19px;display:inline-grid;place-items:center;cursor:pointer;padding:0;vertical-align:middle}
.ib+.ib{margin-left:4px}
.ib .n{position:absolute;top:0;right:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--p);color:#fff;font:700 10px/16px Roboto,sans-serif;text-align:center;padding:0 4px}
.ib .n:empty{display:none}
.sr{padding:6px 14px 10px}
.sr input{width:100%;border:0;background:var(--bg);padding:10px 14px;border-radius:4px;outline:none}
.cats{display:flex;gap:22px;overflow-x:auto;padding:0 14px;background:#fff;border-bottom:1px solid var(--l);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;background:none;border:0;padding:12px 0 10px;font:700 12.5px Roboto,sans-serif;color:var(--m);text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent}
.cat.on{color:var(--i);border-bottom-color:var(--p)}
.banner{margin:10px;padding:18px 16px;border-radius:4px;color:#fff;background:linear-gradient(110deg,#ff3f6c,#ff7a96)}
.banner small{display:inline-block;background:#fff;color:var(--p);font:700 11px Roboto,sans-serif;padding:2px 8px;text-transform:uppercase}
.banner h2{font:900 22px/1.15 Roboto,sans-serif;margin:10px 0 4px}
.banner p{font-size:13.5px;margin-bottom:12px}
.banner a{display:inline-block;background:#fff;color:var(--p);font:700 12.5px Roboto,sans-serif;padding:9px 16px;text-transform:uppercase}
.trust{display:flex;margin:0 10px;background:#fff}
.trust div{flex:1;text-align:center;padding:10px 4px;font-size:11.5px;color:var(--m);border-right:1px solid var(--l)}
.trust div:last-child{border-right:0}
.trust b{display:block;color:var(--i);font-size:12.5px}
.sech{display:flex;justify-content:space-between;align-items:baseline;padding:14px 12px 8px}
.sech h2{font:700 15px Roboto,sans-serif}
.sech span{font-size:12px;color:var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px}
.p{background:#fff;display:flex;flex-direction:column;overflow:hidden}
.pic{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--bg)}
.pic img,.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{background:repeating-linear-gradient(0deg,var(--c) 0 14px,var(--b) 14px 16px),var(--c)}
.p.oos .pic{filter:grayscale(.7);opacity:.6}
.tag{position:absolute;left:0;top:8px;background:var(--i);color:#fff;font:700 10px Roboto,sans-serif;padding:3px 7px}
.info{display:flex;flex-direction:column;gap:4px;padding:10px;flex:1}
.info h3{font:500 13.5px/1.3 Roboto,sans-serif}
.fab{font-size:12px;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price b{font:700 15px Roboto,sans-serif}
.price s{color:var(--g);font-size:12.5px}
.price em{font:700 12px Roboto,sans-serif;color:var(--o);font-style:normal}
.sizes{display:flex;gap:5px;flex-wrap:wrap}
.sz{border:1px solid var(--l);background:#fff;padding:3px 8px;font:500 11.5px Roboto,sans-serif;cursor:pointer}
.sz.on{border-color:var(--i);font-weight:700}
.add{margin-top:6px;border:0;background:var(--p);color:#fff;padding:10px;font:700 12.5px Roboto,sans-serif;text-transform:uppercase;cursor:pointer}
.add:active{background:var(--pd)}
.add:disabled{background:var(--g);cursor:not-allowed}
.empty{grid-column:1/-1;background:#fff;text-align:center;color:var(--m);padding:36px 16px}
footer{margin-top:14px;padding:20px 16px;background:var(--i);color:#c8c9cc;font-size:13.5px;line-height:1.7}
footer h2{color:#fff;font-size:17px}
footer a{color:#ffb3c4;font-weight:700}
footer small{display:block;margin-top:12px;border-top:1px solid #434862;padding-top:10px;color:#9a9fb4}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);z-index:15;display:none}
.bar.show{display:block}
.bar button{width:100%;display:flex;justify-content:space-between;background:var(--p);color:#fff;border:0;padding:15px 16px calc(15px + env(safe-area-inset-bottom,0px));font:700 14px Roboto,sans-serif;text-transform:uppercase;cursor:pointer}
.ov{position:fixed;inset:0;z-index:40;background:rgba(40,44,63,.55);display:none}
.ov.open{display:block}
.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);max-height:92%;display:flex;flex-direction:column;background:var(--bg)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;font:700 16px Roboto,sans-serif;border-bottom:1px solid var(--l)}
.x{background:none;border:0;font-size:26px;cursor:pointer;line-height:1}
.items{flex:1;overflow:auto;background:#fff;padding:0 14px;min-height:60px}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l)}
.th{position:relative;width:54px;height:70px;flex:none;overflow:hidden;background:var(--bg)}
.th img,.th .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.it .m{flex:1;font-weight:500}
.it .m span{display:block;color:var(--g);font-size:12px;font-weight:400}
.q{display:flex;align-items:center;gap:10px;font-weight:700}
.q button{width:28px;height:28px;border:1px solid var(--l);background:#fff;border-radius:50%;cursor:pointer}
.foot{display:flex;flex-direction:column;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--l)}
.foot input,.foot textarea{width:100%;padding:11px 12px;border:1px solid var(--l);border-radius:2px}
.tot{display:flex;justify-content:space-between;font:700 16px Roboto,sans-serif}
.wa{display:block;text-align:center;background:var(--p);color:#fff;padding:14px;font:700 14px Roboto,sans-serif;text-transform:uppercase}
.wa[aria-disabled=true]{opacity:.45;pointer-events:none}
/* ---- admin panel ---- */
.adm{position:fixed;inset:0;z-index:60;overflow:auto;background:var(--bg)}
.adm[hidden]{display:none}
.ah{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--i);color:#fff;font:700 16px Roboto,sans-serif}
.ah button,.sbtn{background:#fff;color:var(--i);border:1px solid #cfd0d4;padding:7px 11px;font:700 12.5px Roboto,sans-serif;cursor:pointer}
.ah button{margin-left:6px}
.wrap{max-width:520px;margin:0 auto;padding-bottom:40px}
.tabs{position:sticky;top:50px;z-index:1;display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--l)}
.tabs button{flex:none;background:none;border:0;padding:12px 14px;font:700 12.5px Roboto,sans-serif;color:var(--m);border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--p);border-bottom-color:var(--p)}
.ab{padding:12px}
.card{background:#fff;padding:14px;margin-bottom:10px}
.card h3{font:700 15px Roboto,sans-serif;margin-bottom:10px}
.adm label{display:block;font:500 12.5px Roboto,sans-serif;color:var(--m);margin-bottom:12px}
.adm input,.adm select,.adm textarea{display:block;width:100%;margin-top:5px;padding:10px 11px;border:1px solid #cfd0d4;border-radius:2px;font:400 14px Roboto,sans-serif;color:var(--i);background:#fff}
.adm .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--i)}
.adm .chk input{width:18px;height:18px;margin:0}
.hint{display:block;font-size:11.5px;color:var(--g);margin-top:4px}
.pbtn{width:100%;background:var(--p);color:#fff;border:0;padding:12px;font:700 14px Roboto,sans-serif;text-transform:uppercase;cursor:pointer}
.sbtn{width:100%;margin-top:8px}
.err{color:var(--r);font-size:13px;min-height:18px;margin-bottom:8px}
.pv{position:relative;width:120px;height:150px;margin-bottom:10px;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--g);font-size:12px}
.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.li{display:flex;gap:10px;align-items:flex-start;background:#fff;padding:10px;margin-bottom:8px}
.li .th{width:52px;height:64px}
.li .meta{flex:1;min-width:0}
.li b{display:block;font:500 13.5px Roboto,sans-serif}
.sub{font-size:12px;color:var(--m)}
.bd{display:inline-block;font:700 10.5px Roboto,sans-serif;padding:2px 6px;margin-top:3px}
.bd.in{background:#e3f6f1;color:var(--gr)}
.bd.out{background:#fde7ea;color:var(--r)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acts button{background:#fff;border:1px solid #cfd0d4;padding:5px 9px;font:500 12px Roboto,sans-serif;cursor:pointer}
.acts .dan{color:var(--r);border-color:#f3c2c6}
.catrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--l)}
.addrow{display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.addrow input{flex:1;margin:0}
.addrow button{flex:none;width:auto;padding:11px 16px}
.adm ol{padding-left:18px;color:var(--m);font-size:13px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--i);color:#fff;padding:10px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80}
#toast.show{opacity:1}
</style>
</head>
<body>

<header class="top">
  <div class="hd">
    <div class="logo" id="logo">anupriya boutique</div>
    <div>
      <a class="ib" id="chatTop" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">💬</a><a class="ib" id="callTop" aria-label="Call us">📞</a><button class="ib" id="bagBtn" aria-label="Open bag">🛍<span class="n" id="bagN"></span></button>
    </div>
  </div>
  <div class="sr"><input id="q" type="search" placeholder="Search Muga, Pat silk, Cotton, Eri…" aria-label="Search products"></div>
</header>

<nav class="cats" id="cats" aria-label="Categories"></nav>

<main>
  <section class="banner" id="banner">
    <small id="bLabel"></small>
    <h2 id="bTitle"></h2>
    <p id="bText"></p>
    <a id="bBtn" target="_blank" rel="noopener"></a>
  </section>
  <section class="trust">
    <div><b>100% handwoven</b>Authentic Assamese</div>
    <div><b>Mekhela Sador only</b>Our one speciality</div>
    <div><b>Order on WhatsApp</b>Quick and simple</div>
  </section>
  <div class="sech"><h2 id="secTitle"></h2><span id="secCount"></span></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <h2 id="footName"></h2>
  <div id="footAddr"></div>
  Call / WhatsApp: <a id="footPhone" href="#"></a><br>
  <a id="footMap" target="_blank" rel="noopener">📍 Find us on the map</a>
  <div id="footTag" style="margin-top:8px"></div>
  <small><span id="copy"></span> · <a id="adminLink" href="#admin">Shop admin login</a></small>
</footer>

<div class="bar" id="bar"><button id="openBag"><span id="barTxt"></span><span>View bag ›</span></button></div>

<div class="ov" id="bagOv">
  <section class="sheet" role="dialog" aria-label="Your bag">
    <div class="dh">My bag <button class="x" id="closeBag" aria-label="Close">×</button></div>
    <div class="items" id="items"></div>
    <div class="foot">
      <div class="tot"><span>Total</span><span id="tot">₹0</span></div>
      <input id="nm" placeholder="Your name" autocomplete="name">
      <textarea id="ad" rows="2" placeholder="Delivery address & phone number"></textarea>
      <a class="wa" id="wa" target="_blank" rel="noopener" aria-disabled="true">Place order on WhatsApp</a>
    </div>
  </section>
</div>

<div class="adm" id="adm" hidden>
  <div class="ah"><span>Shop admin</span><div><button data-a="close">Back to shop</button><button data-a="logout" id="logoutBtn">Logout</button></div></div>
  <div class="wrap" id="admBody"></div>
</div>
<div id="toast"></div>

<script>
// ===== ADMIN LOGIN =====
const ADMIN_ID="8011800753";      // business mobile number
const ADMIN_PASS="Anupriya@123";
const DRAFT="ab_draft_v2", CART="ab_cart_v2";

// ===== HELPERS =====
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const rs=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const PAL=[["#8e1b2c","#e8b84a"],["#1f5f4a","#d9a441"],["#c79a2b","#7a1f2b"],["#2f5d8a","#f1e9d6"],["#d6648f","#f6d36b"],["#6b3fa0","#f0c64f"],["#a3152b","#e9bd58"]];
const P=(id,name,cat,fab,price,mrp,c,b)=>({id,name,cat,fab,price,mrp,c,b,sizes:["Free size"],inStock:true,img:""});

// ===== STARTER DATA (replace from the admin panel) =====
const SEED=[
 P(1,"Pat Silk Mekhela Sador, Floral Butta","Pat Silk","Pure Pat silk",3499,4999,"#8e1b2c","#e8b84a"),
 P(2,"Pat Silk Mekhela Sador, Peacock Border","Pat Silk","Pure Pat silk",4299,5999,"#1f5f4a","#d9a441"),
 P(3,"Muga Silk Mekhela Sador, Golden","Muga","Pure Muga silk",8999,11999,"#c79a2b","#7a1f2b"),
 P(4,"Muga Mekhela Sador, Kolka Motif","Muga","Pure Muga silk",9999,13500,"#d2a63a","#3b2a1a"),
 P(5,"Cotton Handloom Mekhela Sador, Red Motif","Cotton","Handloom cotton",1299,1799,"#f1e9d6","#c4262e"),
 P(6,"Cotton Mekhela Sador, Daily Wear","Cotton","Handloom cotton",999,1399,"#2f5d8a","#f1e9d6"),
 P(7,"Cotton Mekhela Sador, Gamosa Border","Cotton","Handloom cotton",1199,1599,"#fff8e7","#d1202f"),
 P(8,"Mulberry Silk Mekhela Sador, Pink","Mulberry","Mulberry silk",2799,3899,"#d6648f","#f6d36b"),
 P(9,"Mulberry Silk Mekhela Sador, Violet","Mulberry","Mulberry silk",2999,4199,"#6b3fa0","#f0c64f"),
 P(10,"Eri Silk Mekhela Sador, Natural","Eri","Eri silk",3299,4499,"#d9cfba","#6b4a2b"),
 P(11,"Bridal Pat Silk Mekhela Sador Set","Bridal","Pure Pat silk, zari work",7499,9999,"#a3152b","#e9bd58"),
 P(12,"Bridal Muga Mekhela Sador Set","Bridal","Pure Muga silk, zari work",14999,19999,"#c9972e","#8e1b2c")
];
function defaults(){return{
 shop:{name:"Anupriya Boutique",waNumber:"918011800753",phoneShow:"8011800753",
  map:"https://www.google.com/maps/search/?api=1&query=PK+Tower+Rupai+Siding+Kakapather+Road+Doom+Dooma+Assam",
  address:"Rupai Siding, Kako Road (Kakapather Road), PK Tower,\nDoom-Dooma, Assam 786157",
  tagline:"Pure handwoven Mekhela Sador only · Quality · Tradition · Elegance",
  bannerShow:true,bannerLabel:"Festive Special",bannerTitle:"Handwoven Mekhela Sador",bannerText:"Ask us for current offers",bannerBtn:"Ask on WhatsApp"},
 categories:["Pat Silk","Muga","Cotton","Mulberry","Eri","Bridal"],
 products:JSON.parse(JSON.stringify(SEED))}}
function normalize(d){
 d.shop={...defaults().shop,...(d.shop||{})};
 d.products=(d.products||[]).map(p=>({id:p.id??Date.now()+Math.random(),name:p.name||"",cat:p.cat||"",fab:p.fab||"",
  price:Number(p.price)||0,mrp:Number(p.mrp)||0,c:p.c||"#8e1b2c",b:p.b||"#e8b84a",
  sizes:p.sizes&&p.sizes.length?p.sizes:["Free size"],inStock:p.inStock!==false,img:p.img||""}));
 d.categories=[...new Set([...(d.categories||[]),...d.products.map(p=>p.cat)].filter(Boolean))];
 return d;
}
// Published data.json (from the site) unless this browser has a draft from the admin panel
async function loadData(){
 try{const x=JSON.parse(localStorage.getItem(DRAFT)||"null");if(x)return normalize(x)}catch(e){}
 try{const r=await fetch("data.json?v="+Date.now(),{cache:"no-store"});if(r.ok)return normalize(await r.json())}catch(e){}
 return normalize(defaults());
}

let D,cat="All",term="",pick={},cart=[];
let A={ok:false,tab:"products",edit:null,upl:null};
try{cart=JSON.parse(localStorage.getItem(CART)||"[]")}catch(e){}

function saveDraft(){
 try{localStorage.setItem(DRAFT,JSON.stringify(D));flash("Saved ✓")}
 catch(e){alert("Storage is full. Use smaller photos, or type a photo file name instead.")}
}
function flash(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(flash.t);flash.t=setTimeout(()=>t.classList.remove("show"),1600)}
function shrink(f){return new Promise((res,rej)=>{
 const r=new FileReader();r.onerror=rej;
 r.onload=()=>{const im=new Image();im.onerror=rej;
  im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
   c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82))};
  im.src=r.result};
 r.readAsDataURL(f)})}
const picHTML=p=>p.img?`<img src="${esc(p.img)}" alt="" loading="lazy">`:`<div class="ph" style="--c:${p.c};--b:${p.b}"></div>`;

// ===== SHOP PAGE =====
function renderShop(){
 const s=D.shop,wa=t=>`https://wa.me/${s.waNumber}?text=${encodeURIComponent(t)}`;
 $("#logo").textContent=s.name.toLowerCase();
 $("#chatTop").href=wa("Hello "+s.name+", I have a question about Mekhela Sador.");
 $("#callTop").href="tel:+"+s.waNumber;
 $("#banner").hidden=!s.bannerShow;
 $("#bLabel").textContent=s.bannerLabel;$("#bTitle").textContent=s.bannerTitle;$("#bText").textContent=s.bannerText;
 $("#bBtn").textContent=s.bannerBtn;$("#bBtn").href=wa("Hello "+s.name+", what are your current offers?");
 $("#footName").textContent=s.name;$("#footAddr").innerHTML=esc(s.address).replace(/\n/g,"<br>");
 $("#footPhone").textContent=s.phoneShow;$("#footPhone").href="tel:+"+s.waNumber;
 $("#footMap").href=s.map;$("#footTag").textContent=s.tagline;$("#copy").textContent="© "+s.name;
 document.title=s.name+" | Pure Handwoven Mekhela Sador, Doom-Dooma";
}
function renderCats(){
 $("#cats").innerHTML=["All",...D.categories].map(c=>`<button class="cat${c===cat?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
function renderGrid(){
 const list=D.products.filter(p=>(cat==="All"||p.cat===cat)&&(p.name+" "+p.cat+" "+p.fab).toLowerCase().includes(term));
 $("#secTitle").textContent=cat==="All"?"All collections":cat;
 $("#secCount").textContent=list.length+" items";
 $("#grid").innerHTML=list.length?list.map(p=>{
  const sel=pick[p.id]||p.sizes[0],off=p.mrp>p.price?Math.round((1-p.price/p.mrp)*100):0;
  return `<article class="p${p.inStock?"":" oos"}"><div class="pic">${picHTML(p)}${p.inStock?"":'<span class="tag">OUT OF STOCK</span>'}</div>
  <div class="info"><h3>${esc(p.name)}</h3><div class="fab">${esc(p.fab)}</div>
  <div class="price"><b>${rs(p.price)}</b>${off?`<s>${rs(p.mrp)}</s><em>(${off}% OFF)</em>`:""}</div>
  <div class="sizes">${p.sizes.map(s=>`<button class="sz${s===sel?" on":""}" data-p="${p.id}" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
  <button class="add" data-add="${p.id}"${p.inStock?"":" disabled"}>${p.inStock?"Add to bag":"Out of stock"}</button></div></article>`}).join("")
  :'<p class="empty">No items found. Try another search.</p>';
}
function renderCart(){
 const n=cart.reduce((a,i)=>a+i.q,0),t=cart.reduce((a,i)=>a+i.q*i.price,0);
 $("#bagN").textContent=n||"";$("#barTxt").textContent=n+" item"+(n===1?"":"s")+" · "+rs(t);
